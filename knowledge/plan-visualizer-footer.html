<!-- TEXT ANNOTATION SYSTEM — appended automatically, do not edit manually -->
<style>
  /* ── Text annotation system ── */
  .feedback-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 1000;
    width: 48px; height: 48px; border-radius: 50%;
    background: #0d1f35; border: 2px solid #00d4ff44;
    color: #00d4ff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: all 0.2s ease;
    box-shadow: 0 2px 12px #00000066;
  }
  .feedback-fab:hover { background: #0f2640; border-color: #00d4ff88; transform: scale(1.05); }
  .feedback-fab .fab-badge {
    position: absolute; top: -4px; right: -4px;
    background: #00d4ff; color: #0a1628; font-size: 10px; font-weight: 700;
    width: 18px; height: 18px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  .feedback-fab .fab-badge.visible { display: flex; }
  .feedback-popover {
    position: fixed; z-index: 1001;
    background: #0d1f35; border: 1px solid #00d4ff44;
    border-radius: 6px; padding: 10px;
    max-width: 320px; min-width: 240px;
    box-shadow: 0 4px 20px #00000088;
    display: none;
  }
  .feedback-popover.visible { display: block; }
  .feedback-popover textarea {
    width: 100%; background: #0a1628; border: 1px solid #00d4ff33;
    border-radius: 4px; color: #e0e8f0; font-family: inherit;
    font-size: 11px; padding: 6px 8px; resize: vertical;
    min-height: 48px;
  }
  .feedback-popover textarea:focus { outline: none; border-color: #00d4ff66; }
  .feedback-popover .pop-selected {
    font-size: 10px; color: #00d4ff; margin-bottom: 6px;
    max-height: 36px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .feedback-popover .pop-actions {
    display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end;
  }
  .feedback-popover button {
    font-family: inherit; font-size: 10px; padding: 4px 12px;
    border-radius: 3px; cursor: pointer; border: none;
  }
  .feedback-popover .pop-add {
    background: #00d4ff; color: #0a1628; font-weight: 600;
  }
  .feedback-popover .pop-cancel {
    background: transparent; color: #667788; border: 1px solid #ffffff15;
  }
  .feedback-panel {
    position: fixed; bottom: 80px; right: 24px; z-index: 1000;
    width: 360px; max-height: 60vh;
    background: #0d1f35; border: 1px solid #00d4ff44;
    border-radius: 8px; box-shadow: 0 4px 24px #00000088;
    display: none; flex-direction: column;
    overflow: hidden;
  }
  .feedback-panel.visible { display: flex; }
  .feedback-panel-header {
    padding: 10px 14px; border-bottom: 1px solid #00d4ff22;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 600; color: #00d4ff;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .feedback-panel-header button {
    font-family: inherit; font-size: 10px; padding: 4px 10px;
    border-radius: 3px; cursor: pointer;
    background: #00d4ff; color: #0a1628; font-weight: 600; border: none;
  }
  .feedback-panel-items {
    overflow-y: auto; flex: 1; padding: 8px;
  }
  .feedback-item {
    padding: 8px 10px; margin-bottom: 6px;
    background: #0a1628; border: 1px solid #ffffff10;
    border-radius: 4px; font-size: 11px;
  }
  .feedback-item .fi-marked {
    color: #00d4ff; font-size: 10px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .feedback-item .fi-comment { color: #c0ccd8; margin-top: 3px; }
  .feedback-item .fi-delete {
    float: right; cursor: pointer; color: #ff606088;
    font-size: 10px; background: none; border: none; font-family: inherit;
  }
  .feedback-item .fi-delete:hover { color: #ff6060; }
  .feedback-textarea-wrap {
    position: fixed; bottom: 80px; right: 24px; z-index: 1001;
    width: 400px; display: none;
    background: #0d1f35; border: 1px solid #00d4ff44;
    border-radius: 8px; box-shadow: 0 4px 24px #00000088;
    padding: 12px;
  }
  .feedback-textarea-wrap.visible { display: block; }
  .feedback-textarea-wrap textarea {
    width: 100%; min-height: 120px; background: #0a1628;
    border: 1px solid #00d4ff33; border-radius: 4px;
    color: #e0e8f0; font-family: inherit; font-size: 11px;
    padding: 8px; resize: vertical;
  }
  .feedback-textarea-wrap .ftw-hint {
    font-size: 10px; color: #667788; margin-top: 6px;
  }
  .feedback-textarea-wrap button {
    font-family: inherit; font-size: 10px; padding: 4px 10px;
    border-radius: 3px; cursor: pointer; margin-top: 6px;
    background: transparent; color: #667788; border: 1px solid #ffffff15;
  }
  .feedback-toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: #00d4ff; color: #0a1628; font-size: 11px; font-weight: 600;
    padding: 8px 16px; border-radius: 4px; z-index: 1002;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .feedback-toast.visible { opacity: 1; }
  .feedback-panel-empty {
    padding: 20px; text-align: center; color: #667788; font-size: 11px;
  }
  .feedback-highlight-overlay {
    position: absolute; background: #00d4ff33;
    border-radius: 2px; pointer-events: none; z-index: 999;
    outline: 1px solid #00d4ff44;
  }

  @media (max-width: 768px) {
    .feedback-panel { width: calc(100vw - 48px); right: 24px; }
    .feedback-textarea-wrap { width: calc(100vw - 48px); }
  }
</style>

<div class="feedback-fab" onclick="togglePanel()" title="Review feedback">
  <span>💬</span>
  <span class="fab-badge" id="fabBadge">0</span>
</div>

<div class="feedback-popover" id="feedbackPopover">
  <div class="pop-selected" id="popSelected"></div>
  <textarea id="popComment" placeholder="Add your comment..." rows="2"></textarea>
  <div class="pop-actions">
    <button class="pop-cancel" onclick="hidePopover()">Cancel</button>
    <button class="pop-add" onclick="submitFeedback()">Add</button>
  </div>
</div>

<div class="feedback-panel" id="feedbackPanel">
  <div class="feedback-panel-header">
    <span>Feedback (<span id="panelCount">0</span>)</span>
    <button onclick="copyFeedback()">Copy Feedback</button>
  </div>
  <div class="feedback-panel-items" id="panelItems"></div>
</div>

<div class="feedback-textarea-wrap" id="feedbackTextarea">
  <textarea id="ftaContent" readonly></textarea>
  <div class="ftw-hint">Select all and copy (Ctrl+C / Cmd+C)</div>
  <button onclick="closeFeedbackTextarea()">Close</button>
</div>

<div class="feedback-toast" id="feedbackToast"></div>

<script>
(function() {
  var items = [];
  var currentSelection = '';
  var highlightOverlays = [];
  var popover = document.getElementById('feedbackPopover');
  var panel = document.getElementById('feedbackPanel');
  var badge = document.getElementById('fabBadge');
  var popSelected = document.getElementById('popSelected');
  var popComment = document.getElementById('popComment');
  var panelCount = document.getElementById('panelCount');
  var panelItems = document.getElementById('panelItems');

  document.addEventListener('mouseup', function(e) {
    if (e.target.closest('.feedback-popover, .feedback-panel, .feedback-fab, .feedback-textarea-wrap')) return;
    var sel = window.getSelection().toString().trim();
    if (sel.length > 0 && sel.length < 500) {
      currentSelection = sel;
      showPopover(e);
    } else {
      hidePopover();
    }
  });

  document.addEventListener('scroll', function() { clearHighlight(); }, true);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { hidePopover(); closeFeedbackTextarea(); }
    if (e.key === 'Enter' && !e.shiftKey && document.activeElement === popComment) {
      e.preventDefault(); submitFeedback();
    }
  });

  function highlightSelection() {
    clearHighlight();
    var sel = window.getSelection();
    if (sel.rangeCount === 0) return;
    var rects = sel.getRangeAt(0).getClientRects();
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i];
      if (r.width < 2) continue;
      var div = document.createElement('div');
      div.className = 'feedback-highlight-overlay';
      div.style.left = (r.left + window.scrollX) + 'px';
      div.style.top = (r.top + window.scrollY) + 'px';
      div.style.width = r.width + 'px';
      div.style.height = r.height + 'px';
      document.body.appendChild(div);
      highlightOverlays.push(div);
    }
    sel.removeAllRanges();
  }

  function clearHighlight() {
    highlightOverlays.forEach(function(el) { el.remove(); });
    highlightOverlays = [];
  }

  function showPopover(e) {
    highlightSelection();
    popSelected.textContent = currentSelection.length > 80
      ? currentSelection.substring(0, 80) + '...' : currentSelection;
    popComment.value = '';
    var x = Math.min(e.clientX, window.innerWidth - 340);
    var y = Math.min(e.clientY + 10, window.innerHeight - 140);
    popover.style.left = Math.max(12, x) + 'px';
    popover.style.top = Math.max(12, y) + 'px';
    popover.classList.add('visible');
    setTimeout(function() { popComment.focus(); }, 50);
  }

  window.hidePopover = function() {
    clearHighlight();
    popover.classList.remove('visible');
    currentSelection = '';
  };

  window.submitFeedback = function() {
    var comment = popComment.value.trim();
    if (!comment || !currentSelection) return;
    items.push({ marked: currentSelection, comment: comment });
    hidePopover();
    updateBadge();
    renderPanel();
  };

  window.togglePanel = function() {
    var ta = document.getElementById('feedbackTextarea');
    if (ta.classList.contains('visible')) { ta.classList.remove('visible'); return; }
    panel.classList.toggle('visible');
    renderPanel();
  };

  function updateBadge() {
    badge.textContent = items.length;
    badge.classList.toggle('visible', items.length > 0);
    panelCount.textContent = items.length;
  }

  function renderPanel() {
    if (items.length === 0) {
      panelItems.innerHTML = '<div class="feedback-panel-empty">Select text on the page and add comments to build feedback.</div>';
      return;
    }
    panelItems.innerHTML = '';
    items.forEach(function(item, i) {
      var marked = item.marked.length > 60 ? item.marked.substring(0, 60) + '...' : item.marked;
      var div = document.createElement('div');
      div.className = 'feedback-item';
      var btn = document.createElement('button');
      btn.className = 'fi-delete';
      btn.textContent = 'remove';
      btn.onclick = function() { removeFeedback(i); };
      var mDiv = document.createElement('div');
      mDiv.className = 'fi-marked';
      mDiv.textContent = '"' + marked + '"';
      var cDiv = document.createElement('div');
      cDiv.className = 'fi-comment';
      cDiv.textContent = item.comment;
      div.appendChild(btn);
      div.appendChild(mDiv);
      div.appendChild(cDiv);
      panelItems.appendChild(div);
    });
  }

  window.removeFeedback = function(i) {
    items.splice(i, 1);
    updateBadge();
    renderPanel();
  };

  window.copyFeedback = function() {
    if (items.length === 0) return;
    var text = 'Feedback about the plan:\n' + items.map(function(item, i) {
      return (i + 1) + '. About `' + item.marked + '`: ' + item.comment;
    }).join('\n');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('Copied to clipboard!');
      }).catch(function() { showTextarea(text); });
    } else {
      showTextarea(text);
    }
  };

  function showTextarea(text) {
    panel.classList.remove('visible');
    var wrap = document.getElementById('feedbackTextarea');
    var ta = document.getElementById('ftaContent');
    ta.value = text;
    wrap.classList.add('visible');
    ta.focus();
    ta.select();
  }

  window.closeFeedbackTextarea = function() {
    document.getElementById('feedbackTextarea').classList.remove('visible');
  };

  function showToast(msg) {
    var toast = document.getElementById('feedbackToast');
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(function() { toast.classList.remove('visible'); }, 2000);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
